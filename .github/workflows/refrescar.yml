# Vuelve a publicar el sitio una vez por día.
#
# El sitio es estático: las actividades y convocatorias vencidas
# desaparecen cuando se compila. Sin esto, algo que venció queda a la
# vista hasta el próximo cambio de contenido.
#
# Para que funcione hay que crear un Deploy Hook en Vercel
# (Settings → Git → Deploy Hooks) y guardar su URL como secreto del
# repositorio, con el nombre VERCEL_DEPLOY_HOOK.

name: Refrescar el sitio

on:
  schedule:
    # 06:10 UTC = 03:10 en Buenos Aires, con el día ya cambiado.
    - cron: '10 6 * * *'
  workflow_dispatch:

jobs:
  refrescar:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir un nuevo deploy
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            echo "Falta el secreto VERCEL_DEPLOY_HOOK. Mirá las instrucciones de este archivo."
            exit 1
          fi
          curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}" -o /dev/null
          echo "Deploy solicitado."
